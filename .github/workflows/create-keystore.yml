name: Create Android Keystore

on:
  workflow_dispatch:

# ============================================================
# ⚙️ فقط این دو خط رو عوض کن
# ============================================================
env:
  KEYSTORE_NAME: "FoxEggs"
  PASSWORD: "Mani_3840494915_Mani"

jobs:
  create-keystore:
    runs-on: ubuntu-24.04

    steps:
      # ==========================================
      # SETUP JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ==========================================
      # CREATE KEYSTORE
      # ==========================================
      - name: Create keystore
        run: |
          KEYSTORE_FILE="${{ env.KEYSTORE_NAME }}.keystore"

          echo "🔐 Creating keystore..."

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "${{ env.KEYSTORE_NAME }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storetype PKCS12 \
            -storepass "${{ env.PASSWORD }}" \
            -keypass "${{ env.PASSWORD }}" \
            -dname "CN=${{ env.KEYSTORE_NAME }}"

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "❌ Keystore creation failed!"
            exit 1
          fi

          echo "✅ Keystore created"
          ls -lh "$KEYSTORE_FILE"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # VERIFY
      # ==========================================
      - name: Verify keystore
        run: |
          keytool -list -v \
            -keystore "${{ env.KEYSTORE_FILE }}" \
            -storepass "${{ env.PASSWORD }}" 2>&1 | head -20
          echo "✅ Valid"

      # ==========================================
      # BASE64
      # ==========================================
      - name: Convert to base64
        run: |
          base64 -w 0 "${{ env.KEYSTORE_FILE }}" > keystore-base64.txt
          echo "✅ Base64 created ($(wc -c < keystore-base64.txt) bytes)"

      # ==========================================
      # INFO FILE
      # ==========================================
      - name: Create info file
        run: |
          cat > INFO.txt <<EOF
          ============================================================
          🔐 KEYSTORE INFO
          ============================================================
          Keystore File:  ${{ env.KEYSTORE_FILE }}
          Alias:          ${{ env.KEYSTORE_NAME }}
          Password:       ${{ env.PASSWORD }}

          🔑 GITHUB SECRETS:
          ------------------------------------------------------------
          KEYSTORE_BASE64     = (paste content of keystore-base64.txt)
          KEYSTORE_PASSWORD   = ${{ env.PASSWORD }}
          ============================================================
          EOF

          echo "✅ Info created"

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: keystore-${{ github.run_number }}
          path: |
            ${{ env.KEYSTORE_FILE }}
            keystore-base64.txt
            INFO.txt
          retention-days: 90
          if-no-files-found: error

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Summary
        run: |
          echo ""
          echo "🎉 KEYSTORE CREATED!"
          echo ""
          echo "📥 Download: keystore-${{ github.run_number }}"
          echo ""
          echo "📁 Files:"
          echo "   1. ${{ env.KEYSTORE_FILE }}"
          echo "   2. keystore-base64.txt"
          echo "   3. INFO.txt"
